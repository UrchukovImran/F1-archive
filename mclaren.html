<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scaleable=0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=auto">
    <title>Scuderia Ferrari</title>
    <link rel="stylesheet" href="mclaren.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Basic&family=Birthstone&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Oswald:wght@200..700&family=Playwrite+DE+SAS+Guides&family=Prociono&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto+Slab:wght@100..900&display=swap"
        rel="stylesheet">
        <link rel="preload" href="SbBPapaya.woff2" as="font" type="font/woff2" crossorigin>

</head>

<body>
    <header>
        <div class="top-bar">
            <img src="logo.png">
        </div>
        <div class="under-bar-line"></div>
    </header>
    <div class="container">
        <main>
            <div class="background-car-name">
                <div class="car-name">MCL40</div>
                <div class="car"><img src="2026mclarencarright.avif"></div>
            </div>
            <div class="car-info-block">
                <div style="margin-top: 50px; margin-bottom: 50px;" class="under-bar-line-1"></div>
                <h1>ABOUT MCL40</h1>
                <div style="margin-top: 50px; margin-bottom: 50px;" class="under-bar-line-2"></div>
                <div class="the-car-above">
                    <div class="button">
                        <!-- AI: Кнопка переключает постоянное отображение подписей. -->
                        <button type="button" aria-pressed="false">On/Off</button>
                    </div>
                    <img src="MCL40.png">

                    <div class="front-wing"></div>
                    <div class="line-1">Active aero front wing</div>

                    <div class="tires-1"></div>
                    <div class="line-2">Left Front Tire</div>

                    <div class="tires-2"></div>
                    <div class="line-3">Right Rear Tire</div>

                    <div class="tires-3"></div>
                    <div class="line-4">Right Front Tire</div>

                    <div class="tires-4"></div>
                    <div class="line-5">Left Rear Tire</div>

                    <div class="cockpit"></div>
                    <div class="line-6">Cockpit</div>

                    <div class="halo">
                        <div class="halo-1"></div>
                        <div class="halo-2"></div>
                        <div class="halo-3"></div>
                        <div class="halo-4"></div>
                        <div class="halo-5"></div>
                        <div class="halo-6"></div>
                        <div class="halo-7"></div>
                    </div>
                    <div class="line-7">Halo</div>


                    <div class="rear-wing"></div>
                    <div class="line-8">Active aero rear wing</div>
                </div>
            </div>



            <div class="drivers-block">
                <div class="under-bar-line-3"></div>
                <h1>DRIVERS</h1>
                <div class="under-bar-line-4"></div>
                <div class="drivers-grid">
                    <div class="leclerc">
                        <img class="lec-img" src="LN1.avif">
                        <div class="driver-name">Lando</div>
                        <div class="driver-lastname">NORRIS</div>
                        <div class="small-det">
                            <div class="number">1</div>
                            <div class="small-line"></div>
                            <div class="fam">NOR</div>
                            <div class="small-line-1"></div>
                            <div class="flag"><img src="images.png"></div>
                        </div>
                    </div>
                
                <div class="hamilton">
                    <img class="ham-img" src="OP81.avif">
                    <div class="driver-name">Oscar</div>
                    <div class="driver-lastname">PIASTRI</div>
                    <div class="small-det">
                            <div class="number">81</div>
                            <div class="small-line"></div>
                            <div class="fam">PIA</div>
                            <div class="small-line-1"></div>
                            <div class="flag"><img src="AUS FLAG.png"></div>
                        </div>
                </div>
                </div>
            </div>






        <div class="under-bar-line-adaptive"></div>
            <div class="drivers-block-adaptive">
                <h1 class="title-adaptive">DRIVERS</h1>
                <div class="leclerc-adaptive">
                    <img class="lec-lec-adaptive" src="LN1.avif">
                    <div class="driver-name-adaptive">Lando</div>
                    <div class="driver-lastname-adaptive">NORRIS</div>
                    <div class="small-det-adaptive">
                    <div class="number-adaptive">1</div>
                    <div class="flag-adaptive"><img src="images.png"></div>
                    </div>
                </div>
                <div class="hamilton-adaptive">
                    <img class="ham-ham-adaptive" src="OP81.avif">
                    <div class="driver-name-adaptive">Oscar</div>
                    <div class="driver-lastname-adaptive">PIASTRI</div>
                    <div class="small-det-adaptive">
                        <div class="number-adaptive">81</div>
                        <div class="flag-adaptive"><img src="AUS FLAG.png"></div>
                    </div>

                </div>
                
            </div>
            <div class="under-bar-line"></div>
            <div class="home-button"><button  onclick="window.location.href='index.html';">HOME</button></div>
    </div>
    </main>
    </div>
    <!-- AI: Скрипт включает и выключает режим постоянного отображения деталей. -->
    <script>
        const carDetails = document.querySelector('.the-car-above');
        const toggleButton = carDetails.querySelector('.button button');

        toggleButton.addEventListener('click', () => {
            const isActive = carDetails.classList.toggle('is-active');
            toggleButton.setAttribute('aria-pressed', String(isActive));
        });
    </script>
</body>

</html>
